name: order_facts
statement: |
  SELECT o.id AS order_id, o.order_date, o.status, o.amount,
         c.name AS customer_name, c.region
  FROM orders o
  JOIN customers c ON o.customer_id = c.id
properties:
  description: One row per order with its customer's name and sales region.
